name: Update Clash routing profiles

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 00:00 China Standard Time (Sunday 16:00 UTC).
    - cron: '0 16 * * 0'

permissions:
  contents: write

concurrency:
  group: clash-rules-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Test converter
        run: python -m unittest discover -s tests -v
      - name: Fetch, convert, and validate remote profiles
        run: python scripts/update_profiles.py
      - name: Commit updated profiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/excluded_404.json dist README.md reports
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update remote Clash profiles'
            git push
          fi
