proxy-groups:
- name: 🌑Proxy
  type: select
  include-all-proxies: true
  filter: (?:.*)
- name: 🛡Guard
  type: select
  proxies:
  - ⛔️Reject
  - 🌐Direct
- name: 🌐Direct
  type: select
  proxies:
  - DIRECT
- name: ⛔️Reject
  type: select
  proxies:
  - REJECT
