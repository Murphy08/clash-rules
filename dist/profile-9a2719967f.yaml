proxy-groups:
- name: Global
  type: select
  include-all-proxies: true
  filter: (?:.*)
- name: Domestic
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - DIRECT
  - Global
- name: AdBlock
  type: select
  proxies:
  - REJECT
  - Global
  - Domestic
- name: Apple_API
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - Domestic
  - Global
- name: Apple_CDN
  type: select
  proxies:
  - Domestic
  - Apple_API
- name: AsianMedia
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - Domestic
  - Global
- name: GlobalMedia
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - Global
  - Domestic
