  - 🚀 节点选择
  - DIRECT
  - 🇺🇲 美国自动
  - 🇭🇰 香港自动
  - 🇨🇳 台湾自动
  - 🇸🇬 狮城自动
  - 🇯🇵 日本自动
  - 🚀 手动切换1
- name: 🇺🇲 美国自动
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 250
  include-all-proxies: true
  filter: (?:^((?!AUS).)*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|UnitedStates|USA|US|United
    States|America|California)((?!AUS).)*)
- name: 🇭🇰 香港自动
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
  include-all-proxies: true
  filter: (?:香港|HK|Hong Kong|Hongkong)
- name: 🇨🇳 台湾自动
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
  include-all-proxies: true
  filter: (?:台|新北|彰化|TW|Taiwan)
- name: 🇸🇬 狮城自动
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
  include-all-proxies: true
  filter: (?:新加坡|坡|狮城|SG|Singapore)
- name: 🇯🇵 日本自动
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
  include-all-proxies: true
  filter: (?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|Tokyo)
