proxy-groups:
- name: 🧭Final
  type: select
  proxies:
  - 🌑Proxy
  - 🌐Direct
- name: 🌑Proxy
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - 🧯Fallback
  - 🕹AutoTest
- name: 🎞Streaming
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - 🌑Proxy
  - 🕹AutoTest
- name: 🎞StreamingSE
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - 🌐Direct
- name: 🎮Game
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - 🌐Direct
- name: 🛡Guard
  type: select
  proxies:
  - ⛔️Reject
  - 🌐Direct
- name: 🧯Fallback
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
  filter: (?:.*)
- name: 🕹AutoTest
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
  filter: (?:.*)
- name: ⛔️Reject
  type: select
  proxies:
  - REJECT
- name: 🌐Direct
  type: select
  proxies:
  - DIRECT
