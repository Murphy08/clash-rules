proxy-groups:
- name: 🏖广告
  type: select
  proxies:
  - DIRECT
  - REJECT
- name: 🍎苹果
  type: select
  proxies:
  - DIRECT
  - 🔰代理
- name: 🕹名单
  type: select
  proxies:
  - DIRECT
  - 🔰代理
- name: 🔰代理
  type: select
  proxies:
  - 🇭🇰高级专线
  - 🇸🇬高级专线
  - 🔥标准专线
  - 🌟国际中继
  - 🏠墙洞之家
- name: 🎬奈飞
  type: select
  proxies:
  - 🇸🇬高级专线
  - 🇲🇴澳门国际
- name: 📹油管
  type: select
  proxies:
  - 🇭🇰高级专线
  - 🔥标准专线
  - 🌟国际中继
- name: 📡电报
  type: select
  proxies:
  - 🇸🇬高级专线
  - 🇲🇴澳门国际
- name: 🇭🇰高级专线
  type: select
  include-all-proxies: true
  filter: (?:香港\.\*\(IPLC\|IEPL\))
- name: 🇸🇬高级专线
  type: select
  include-all-proxies: true
  filter: (?:新加坡\.\*\(IPLC\|IEPL\))
- name: 🔥标准专线
  type: select
  include-all-proxies: true
  filter: (?:标准\ IPLC)
- name: 🌟国际中继
  type: select
  include-all-proxies: true
  filter: (?:BGP)
- name: 🇲🇴澳门国际
  type: select
  include-all-proxies: true
  filter: (?:澳门\ CTM)
- name: 🏠墙洞之家
  type: select
  include-all-proxies: true
  filter: (?:.*)
