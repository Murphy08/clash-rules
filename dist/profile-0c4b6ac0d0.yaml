proxy-groups:
- name: Proxies
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - UrlTest
  - HK
  - SG
  - JP
  - US
  - TW
- name: Apple
  type: select
  proxies:
  - DIRECT
  - Proxies
- name: MicroSoft
  type: select
  proxies:
  - DIRECT
  - Proxies
- name: Telegram
  type: select
  include-all-proxies: true
  filter: (?:AIA)
  proxies:
  - Proxies
  - HK
  - SG
- name: Streaming
  type: select
  include-all-proxies: true
  filter: (?:NF\|Netflix\|NETFLIX\|原生\|解锁)
  proxies:
  - Proxies
  - HK
  - SG
  - JP
  - US
  - TW
- name: StreamingSE
  type: select
  proxies:
  - DIRECT
  - Proxies
  - HK
  - TW
- name: Game
  type: select
  include-all-proxies: true
  filter: (?:AIA\|游戏)
  proxies:
  - DIRECT
  - Proxies
- name: Final
  type: select
  proxies:
  - DIRECT
  - Proxies
- name: UrlTest
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  include-all-proxies: true
  filter: (?:.*)
- name: HK
  type: select
  include-all-proxies: true
  filter: (?:港\|HK)
- name: SG
  type: select
  include-all-proxies: true
  filter: (?:新加坡\|狮城\|SG)
- name: TW
  type: select
  include-all-proxies: true
  filter: (?:台\|新北\|彰化\|TW)
- name: JP
  type: select
  include-all-proxies: true
  filter: (?:日本\|JP)
- name: US
  type: select
  include-all-proxies: true
  filter: (?:美\|US)
