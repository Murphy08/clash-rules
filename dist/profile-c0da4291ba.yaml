proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 💻 普通节点
  - ♻️ 自动选择
  - 📺 省流节点
  - 👍 高级节点
  - 🇺🇲 美国节点
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇦🇷 阿根廷节点
  - 🇹🇷 土耳其节点
  - 🇯🇵 日本节点
  - 🎥 流媒体解锁
  - 🍕 手动切换
  - DIRECT
- name: 🍕 手动切换
  type: select
  include-all-proxies: true
  filter: (?:.*)
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:.*)
- name: 💻 普通节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:[^\.\d](x1|1x)[^\.\d]|^((?!x).)+$)
- name: 📺 省流节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:(?<![\.\d])(x0\.[1-9]|0\.[1-9]x|x0\.[0-9][0-9]|0\.[0-9][0-9]x)(?![\.\d])|低倍率|省流|大流量)
- name: 👍 高级节点
  type: select
  include-all-proxies: true
  filter: (?:(?<![\.\d])(x1\.[1-9]|1\.[1-9]x|x[^01](\.[0-9])?|[^01](\.[0-9])?x|x\d{2,}|\d{2,}x)(?![\.\d])|专线|专用|高级|直连|急速|高倍率|IEPL|IPLC|AIA|CTM|CC|iepl|iplc|aia|ctm|cc|AC)
- name: 🇺🇲 美国节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
  include-all-proxies: true
  filter: (?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|[^A-Za-z]+US[^A-Za-z]+|United
    States)
- name: 🇭🇰 香港节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:港|HK|Hong Kong)
- name: 🇯🇵 日本节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|[^A-Za-z]+JP[^A-Za-z]+|Japan)
- name: 🇨🇳 台湾节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:台|新北|彰化|[^A-Za-z]+TW[^A-Za-z]+|Taiwan)
- name: 🇸🇬 新加坡节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:新加坡|坡|狮城|[^A-Za-z]+SG[^A-Za-z]+|Singapore)
- name: 🇦🇷 阿根廷节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:阿根廷|[^A-Za-z]+AR[^A-Za-z]+|Argentina)
- name: 🇹🇷 土耳其节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:土耳其|[^A-Za-z]+TR[^A-Za-z]+|Türkiye|Turkey)
- name: 🎥 流媒体解锁
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  include-all-proxies: true
  filter: (?:NF|原生|奈飞|解锁|流媒|迪士尼|N.*D|Netflix|NETFLIX|Media|Disn|Unlock)
- name: 🛑 广告拦截
