proxy-groups:
- name: 🚀 国外流量
  type: select
  proxies:
  - ♻️ 自动选择
  - 🔯 故障转移
  - 🔮 负载均衡
  - ✈️ 手动选择
  - 🛩️ 手动选择备用
  - 🚁 自建节点
- name: ✈️ 手动选择
  type: select
  include-all-proxies: true
  filter: (?:.*)
- name: 🛩️ 手动选择备用
  type: select
  include-all-proxies: true
  filter: (?:.*)
- name: 🚁 自建节点
  type: select
  include-all-proxies: true
  filter: (?:HK-|TW-|SG-|US-|GB-|KR-)
- name: 🎯 国内流量
  type: select
  include-all-proxies: true
  filter: (?:电信|联通|移动)
  proxies:
  - DIRECT
  - 🚀 国外流量
  - ✈️ 手动选择
  - 🛩️ 手动选择备用
  - 🚁 自建节点
