proxy-groups:
- name: 🔰 线路选择
  type: select
  include-all-proxies: true
  filter: (?:select)|(?:.*)
  proxies:
  - 🚁 vip2-AUTO
  - 🛰 IPLC-AUTO
  - 🚀 vip1-AUTO
  - ⏩ 直连
- name: 🎥 分流-NETFLIX
  type: select
  include-all-proxies: true
  filter: (?:v)
  proxies:
  - 🔰 线路选择
  - 🚁 vip2-AUTO
  - ⏩ 直连
- name: 🎥 分流-YouTube
  type: select
  include-all-proxies: true
  filter: (?:v)
  proxies:
  - 🔰 线路选择
  - 🚁 vip2-AUTO
  - ⏩ 直连
- name: 📲 分流-电报代理
  type: select
  include-all-proxies: true
  filter: (?:v)
  proxies:
  - 🔰 线路选择
  - 🛰 IPLC-AUTO
  - ⏩ 直连
- name: 📺 分流-巴哈姆特
  type: select
  include-all-proxies: true
  filter: (?:台)
  proxies:
  - 🔰 线路选择
  - ⏩ 直连
- name: 🛑 广告拦截
  type: select
  proxies:
  - 🚫 屏蔽
  - ⏩ 直连
- name: 🌍 国外媒体
  type: select
  proxies:
  - 🔰 线路选择
  - 🚁 vip2-AUTO
  - ⏩ 直连
- name: 🌏 国内媒体
  type: select
  proxies:
  - ⏩ 直连
  - 🔰 线路选择
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🔰 线路选择
  - 🚁 vip2-AUTO
  - ⏩ 直连
- name: 🚀 vip1-AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 400
  include-all-proxies: true
  filter: (?:v1)
- name: 🚁 vip2-AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 400
  include-all-proxies: true
  filter: (?:v2[0-9])
- name: 🛰 IPLC-AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 400
  include-all-proxies: true
  filter: (?:IPLC)
- name: ⏩ 直连
  type: select
  proxies:
  - DIRECT
- name: 🚫 屏蔽
  type: select
  proxies:
  - REJECT
