proxy-groups:
- name: 🖲️ 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇸🇬 狮城节点
  - 🇯🇵 日本节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🌀 手动切换
  type: select
  include-all-proxies: true
  filter: (?:^((?!(过期|免费)).)*$)
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 250
  proxies:
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇸🇬 狮城节点
  - 🇯🇵 日本节点
- name: 🎶 网易音乐
  type: select
  include-all-proxies: true
  filter: (?:网易|音乐|Music|NetEase)
  proxies:
  - 🎯 全球直连
- name: 📹 油管视频
  type: select
  proxies:
  - 🖲️ 节点选择
  - 🇸🇬 狮城节点
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇯🇵 日本节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🎥 奈飞视频
  type: select
  proxies:
  - 🎥 奈飞节点
  - 🖲️ 节点选择
  - 🇸🇬 狮城节点
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇯🇵 日本节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🎥 奈飞节点
  type: select
  include-all-proxies: true
  filter: (?:NF)
- name: 📺 巴哈姆特
  type: select
  proxies:
  - 🇨🇳 台湾节点
  - 🖲️ 节点选择
  - 🌀 手动切换
  - 🎯 全球直连
- name: 📺 哔哩哔哩
  type: select
  proxies:
  - 🎯 全球直连
  - 🇨🇳 台湾节点
  - 🇭🇰 香港节点
- name: 🌍 国外媒体
  type: select
  proxies:
  - 🖲️ 节点选择
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇸🇬 狮城节点
  - 🇯🇵 日本节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🌏 国内媒体
  type: select
  proxies:
  - 🎯 全球直连
  - 🖲️ 节点选择
  - 🌀 手动切换
- name: 📲 电报消息
  type: select
  proxies:
  - 🖲️ 节点选择
  - 🇸🇬 狮城节点
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇯🇵 日本节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 📱 推特内容
  type: select
  proxies:
  - 🖲️ 节点选择
  - 🇸🇬 狮城节点
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇯🇵 日本节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 📢 谷歌FCM
  type: select
  proxies:
  - 🎯 全球直连
  - 🖲️ 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
- name: Ⓜ️ 微软云盘
  type: select
  proxies:
  - 🎯 全球直连
  - 🖲️ 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
- name: 🍎 苹果服务
  type: select
  proxies:
  - 🎯 全球直连
  - 🖲️ 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
- name: 🎮 游戏平台
  type: select
  proxies:
  - 🎯 全球直连
  - 🖲️ 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
- name: 🛑 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🍃 应用净化
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🕹 规则之外
  type: select
  proxies:
  - 🖲️ 节点选择
  - ♻️ 自动选择
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🇭🇰 香港节点
  type: select
  include-all-proxies: true
  filter: (?:港|(?i)HK)
- name: 🇨🇳 台湾节点
  type: select
  include-all-proxies: true
  filter: (?:台|(?i)TW)
- name: 🇸🇬 狮城节点
  type: select
  include-all-proxies: true
  filter: (?:狮城|(?i)SG)
- name: 🇯🇵 日本节点
  type: select
  include-all-proxies: true
  filter: (?:日|(?i)JP)
