name: Update routing-only rules daily

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-routing-only.yml'
      - 'scripts/update_routing_only.py'
      - 'tests/test_routing_only.py'
      - 'requirements.txt'
  schedule:
    # Daily at 00:00 China Standard Time (16:00 UTC).
    - cron: '0 16 * * *'

permissions:
  contents: write

# Serialize publication with the weekly grouped-profile workflow.
concurrency:
  group: clash-rules-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Test routing converter
        run: python -m unittest discover -s tests -p test_routing_only.py -v
      - name: Sync and validate routing-only rules
        run: python scripts/update_routing_only.py
      - name: Commit validated rules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/routing-only.yaml reports/routing-only.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync routing-only rules'
            git push origin HEAD:main
          fi
