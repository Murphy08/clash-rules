  include-all-proxies: true
  filter: (?:新|新加坡|坡|狮城|SG|Singapore)
- name: 🇨🇳 台湾节点
  type: select
  include-all-proxies: true
  filter: (?:台|新北|彰化|TW|Taiwan)
- name: 🇰🇷 韩国节点
  type: select
  include-all-proxies: true
  filter: (?:KR|Korea|KOR|首尔|韩|韓)
- name: 🎥 奈飞节点
  type: select
  include-all-proxies: true
  filter: (?:NF|奈飞|解锁|Netflix|NETFLIX|Media|原生)
- name: 🔑 专用线路
  type: select
  include-all-proxies: true
  filter: (?:IPLC|IEPL|iplc|iepl|专线)
