proxy-groups:
- name: Proxies
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - UrlTest
  - HK
  - SG
  - JP
  - US
  - TW
- name: Apple
  type: select
  proxies:
  - DIRECT
  - Proxies
- name: MicroSoft
  type: select
  proxies:
  - DIRECT
  - Proxies
- name: Telegram
  type: select
  proxies:
  - Proxies
  - HK
  - SG
- name: Streaming
  type: select
  include-all-proxies: true
  filter: (?:NF\|Netflix\|NETFLIX\|原生\|解锁)
  proxies:
  - Proxies
  - HK
  - SG
  - JP
  - US
  - TW
- name: StreamingSE
  type: select
  proxies:
  - DIRECT
  - Proxies
  - HK
  - TW
- name: PlusMedia
  type: select
  proxies:
  - SG
  - JP
  - US
- name: Netease
  type: select
  include-all-proxies: true
  filter: (?:NeteaseUnblock\|Netease\|netease\|网易\|云音乐)
  proxies:
  - DIRECT
  - Proxies
- name: UrlTest
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  include-all-proxies: true
  filter: (?:U\d+|T\d+)
- name: HK
  type: select
  include-all-proxies: true
  filter: (?:港)
- name: SG
  type: select
  include-all-proxies: true
  filter: (?:新\|狮城)
- name: TW
  type: select
  include-all-proxies: true
  filter: (?:台)
- name: JP
  type: select
  include-all-proxies: true
  filter: (?:日)
- name: US
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 600
  include-all-proxies: true
  filter: (?:美)
