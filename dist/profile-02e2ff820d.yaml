proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🇭🇰 香港节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🌀 手动切换
  type: select
  include-all-proxies: true
  filter: (?:^((?!(过期|免费)).)*$)
- name: 🎶 网易音乐
  type: select
  include-all-proxies: true
  filter: (?:网易|音乐|Music|NetEase)
  proxies:
  - 🎯 全球直连
- name: 📹 油管视频
  type: select
  proxies:
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🎥 奈飞视频
  type: select
  proxies:
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🌍 国外媒体
  type: select
  proxies:
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🌏 国内媒体
  type: select
  proxies:
  - 🎯 全球直连
  - 🚀 节点选择
  - 🌀 手动切换
- name: 📲 推特电报
  type: select
  proxies:
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
  - 🎯 全球直连
- name: 📢 谷歌FCM
  type: select
  proxies:
  - 🎯 全球直连
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
- name: Ⓜ️ 微软云盘
  type: select
  proxies:
  - 🎯 全球直连
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
- name: 🍎 苹果服务
  type: select
  proxies:
  - 🎯 全球直连
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🌀 手动切换
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
- name: 🛑 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🍃 应用净化
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - 🌀 手动切换
  - 🎯 全球直连
- name: 🇭🇰 香港节点
  type: select
  include-all-proxies: true
  filter: (?:香港|(?i)HK|(?i)Hong Kong)
