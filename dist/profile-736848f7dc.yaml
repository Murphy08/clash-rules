proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🇭🇰 香港节点
  - 🇸🇬 狮城节点
  - 🇺🇲 美国节点
  - 🇯🇵 日本节点
  - 🚀 手动切换
  - DIRECT
- name: 🚀 手动切换
  type: select
  include-all-proxies: true
  filter: (?:.*)
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all-proxies: true
  filter: (?:.*)
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - ♻️ 自动选择
- name: 🛑 全球拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - 🚀 节点选择
  - 🎯 全球直连
  - ♻️ 自动选择
- name: 🇭🇰 香港节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all-proxies: true
  filter: (?:港|HK|hk|Hong Kong|HongKong|hongkong)
- name: 🇯🇵 日本节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all-proxies: true
  filter: (?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)
- name: 🇸🇬 狮城节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all-proxies: true
  filter: (?:新加坡|坡|狮城|SG|Singapore)
- name: 🇺🇲 美国节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all-proxies: true
  filter: (?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)
