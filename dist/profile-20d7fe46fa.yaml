proxy-groups:
- name: Proxies
  type: select
  include-all-proxies: true
  filter: (?:.*)
  proxies:
  - HK
  - JP
  - SG
  - TW
  - US
- name: Netflix
  type: select
  include-all-proxies: true
  filter: (?:NF\|Netflix\|NETFLIX\|原生\|解锁)
  proxies:
  - Proxies
  - HK
  - JP
  - SG
  - TW
  - US
- name: Disney
  type: select
  proxies:
  - Proxies
  - HK
  - JP
  - SG
  - TW
  - US
- name: Streaming
  type: select
  proxies:
  - Proxies
  - HK
  - JP
  - SG
  - TW
  - US
- name: StreamingSE
  type: select
  proxies:
  - DIRECT
  - HK
  - TW
- name: Apple
  type: select
  proxies:
  - Proxies
  - DIRECT
  - HK
  - JP
  - US
- name: HK
  type: select
  include-all-proxies: true
  filter: (?:港\|HK\|Hong\ Kong)
- name: SG
  type: select
  include-all-proxies: true
  filter: (?:新\|新加坡\|狮城\|SG\|Singapore)
- name: TW
  type: select
  include-all-proxies: true
  filter: (?:台\|新北\|彰化\|TW\|Taiwan)
- name: JP
  type: select
  include-all-proxies: true
  filter: (?:日\(\(\?!用\)\.\)\+\|\[\^\-\]日\|东京\|大阪\|埼玉\|JP\|Japan)
- name: US
  type: select
  include-all-proxies: true
  filter: (?:美\|洛杉矶\|硅谷\|达拉斯\|费利蒙\|凤凰城\|芝加哥\|圣何塞\|西雅图\|US\|America\|USA)
