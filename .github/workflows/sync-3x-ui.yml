name: Build 3x-ui ACL4SSR rules daily

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-3x-ui.yml'
      - 'scripts/sync_3x_ui.py'
      - 'tests/test_sync_3x_ui.py'
      - 'config/3x-ui-policy.yaml'
      - 'requirements.txt'
  schedule:
    # Daily at 00:00 China Standard Time (16:00 UTC).
    - cron: '0 16 * * *'

permissions:
  contents: write

# Serialize publication with the weekly grouped-profile workflow.
concurrency:
  group: clash-rules-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Test ACL4SSR builder
        run: python -m unittest discover -s tests -p test_sync_3x_ui.py -v
      - name: Download ACL4SSR providers and build inline routing YAML
        run: python scripts/sync_3x_ui.py
      - name: Commit validated rules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/3x-ui.yaml reports/3x-ui.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync ACL4SSR routing rules'
            git push origin HEAD:main
          fi
