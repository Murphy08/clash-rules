proxy-groups:
- name: 🚀 全局设置
  type: select
  proxies:
  - ♻️ 自动选择节点
  - 🚀 手动选择节点
- name: 🚀 手动选择节点
  type: select
  include-all-proxies: true
  filter: (?:.*)
- name: ♻️ 自动选择节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
  filter: (?:.*)
- name: 🎯 国内网站设置
  type: select
  proxies:
  - DIRECT
  - 🚀 全局设置
  - ♻️ 自动选择节点
  - 🚀 手动选择节点
